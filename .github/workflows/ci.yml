name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The snapshot suite freezes the clock and records transcripts assuming UTC.
  TZ: UTC
  # The end-to-end tests start the xmd binary hundreds of times, and an
  # unoptimized engine makes each start about 5x slower: a light
  # optimization level cuts the suite from ~9 minutes to ~2 on a runner.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The action needs the version spelled out; keep it equal to rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # One run covers every case: the browser feature only adds the cases
      # that drive the browser host (hosts/wasm). The wasm job builds without it.
      # --workspace also runs the crates' own unit tests, which the default
      # member (hosts/cli) alone would skip.
      - name: Test
        run: cargo test --workspace --features xmd/browser

  wasm:
    name: WASM and web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: the action's "latest" lookup sometimes resolves to an old
          # release (v0.9.1) that lacks the --locked flag build.sh passes.
          version: v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix clients/web ci
      - name: Build WASM
        run: bash clients/web/build.sh
      - name: Build site
        run: npm --prefix clients/web run build
      - name: Keep the WASM package for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: clients/web/pkg
          retention-days: 1
      - name: Node tests
        run: npm --prefix clients/web run test:unit
      - name: Type tests
        run: npm --prefix clients/web run test:types
      - name: Build native binary
        # clients/web/tests/render.spec.mjs spawns target/debug/xmd for native parity.
        run: cargo build
      - name: Install Playwright browser
        # playwright.config.mjs pins channel "chrome", so install Google Chrome.
        run: npx --prefix clients/web playwright install --with-deps chrome
      - name: Browser tests
        working-directory: clients/web
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            clients/web/playwright-report
            clients/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  ide:
    name: VS Code extension and installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/ide/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm --prefix clients/ide/vscode ci
      # `npm run test` launches a real VS Code against target/debug/xmd and needs
      # a display; it is not run here. `check` syntax-checks the extension only.
      - name: Check extension sources
        run: npm --prefix clients/ide/vscode run check
      # The runner image ships shellcheck; install.sh must stay plain POSIX sh.
      - name: Check install.sh
        run: shellcheck --shell=sh install.sh

  deploy:
    # The hosted docs app at xmd.dholtz.com is rebuilt from every
    # green push to main, so what is deployed never lags what is merged. Needs
    # the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts:Edit, D1:Edit).
    name: Deploy docs app
    needs: [rust, wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            clients/web/cloud/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: clients/web/pkg
      - name: Install dependencies
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web/cloud ci
      - name: Build the site and the backend module
        # The WASM package comes from the wasm job above; only the site is built here.
        run: npm --prefix clients/web/cloud run build
      - name: Apply database migrations
        working-directory: clients/web/cloud
        # D1's query API sometimes answers with a transient "internal error"
        # (codes 7429, 7500). Applying migrations is idempotent, since D1 records
        # which ones ran, so retry a few times before failing the deploy.
        run: |
          for attempt in 1 2 3 4; do
            npx wrangler d1 migrations apply xmd-docs --remote && exit 0
            echo "Attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy
        working-directory: clients/web/cloud
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
