name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The snapshot suite freezes the clock and records transcripts assuming UTC.
  TZ: UTC

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The version, components and targets come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Test (browser feature)
        run: cargo test -p wtf --features browser

  wasm:
    name: WASM and web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix client/web ci
      - name: Build WASM
        run: bash client/web/build.sh
      - name: Build site
        run: npm --prefix client/web run build
      - name: Keep the WASM package for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: client/web/pkg
          retention-days: 1
      - name: Node tests
        run: npm --prefix client/web run test:unit
      - name: Type tests
        run: npm --prefix client/web run test:types
      - name: Build native binary
        # client/web/tests/render.spec.mjs spawns target/debug/wtf for native parity.
        run: cargo build
      - name: Install Playwright browser
        # playwright.config.mjs pins channel "chrome", so install Google Chrome.
        run: npx --prefix client/web playwright install --with-deps chrome
      - name: Browser tests
        working-directory: client/web
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/web/playwright-report
            client/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  ide:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/ide/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm --prefix client/ide/vscode ci
      # `npm run test` launches a real VS Code against target/debug/wtf and needs
      # a display; it is not run here. `check` syntax-checks the extension only.
      - name: Check extension sources
        run: npm --prefix client/ide/vscode run check

  deploy:
    # The hosted docs app at wtf-docs.drbh.workers.dev is rebuilt from every
    # green push to main, so what is deployed never lags what is merged. Needs
    # the CLOUDFLARE_API_TOKEN repository secret (Workers Scripts:Edit, D1:Edit).
    name: Deploy docs app
    needs: [rust, wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/web/package-lock.json
            client/web/cloud/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: client/web/pkg
      - name: Install dependencies
        run: |
          npm --prefix client/web ci
          npm --prefix client/web/cloud ci
      - name: Build the site and the backend module
        # The WASM package comes from the wasm job above; only the site is built here.
        run: npm --prefix client/web/cloud run build
      - name: Apply database migrations
        working-directory: client/web/cloud
        run: npx wrangler d1 migrations apply wtf-docs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy
        working-directory: client/web/cloud
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
