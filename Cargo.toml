# The language, split into layered crates. lang/core is the language itself
# (common, syntax, model, eval) and lang/stdlib is the .x.md library on top;
# lsp, beside lang, is everything built on it for editors and hosts (features,
# native, wasm, the renderer shared with the web client, and the xmd facade and
# binary).
# `client/ide/zed` is a crate too, but it targets wasm32-wasip2 and keeps its
# own lockfile, so it stays out of this workspace.
[workspace]
members = ["lsp", "lang/core/common", "lang/core/syntax", "lang/core/model", "lang/core/eval", "lsp/host", "lsp/features", "lsp/native", "lsp/wasm", "lsp/renderer"]
default-members = ["lsp"]
exclude = ["client/ide/zed"]
resolver = "3"

# Every crate but the facade opts in with `[lints] workspace = true`: a `pub`
# item its root doesn't publish fails CI, so interfaces stay curated.
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tower-lsp-server = "0.22.1"
url = { version = "2", features = ["serde"] }

# Each crate may depend only on the internal crates listed for it. Pipeline
# order: syntax -> model -> eval -> features -> hosts; common is the shared
# kernel every crate may use, and renderer is a leaf features builds on.
# Enforced by lsp/tests/architecture.rs.
[workspace.metadata.layers]
common = []
syntax = ["common"]
model = ["common", "syntax"]
eval = ["common", "syntax", "model"]
host = ["common", "model", "eval"]
renderer = []
features = ["common", "syntax", "model", "eval", "host", "renderer"]
native = ["common", "syntax", "model", "eval", "host", "features"]
wasm = ["common", "syntax", "model", "eval", "features"]
xmd = ["common", "syntax", "model", "eval", "host", "features", "native", "wasm"]
