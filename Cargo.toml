# The language, split into layered crates. lang/core is the language itself
# (common, syntax, model, eval) and lang/stdlib is the .x.md library on top.
# runtime is what every host shares and the source of truth for runtime
# behavior: services (portable language services), host (native I/O and
# orchestration) and the renderer shared with the web client. The hosts sit
# beside it: lsp (the language server), browser (the wasm host) and cli (the
# xmd binary, which assembles them, and the end-to-end tests).
# `client/ide/zed` is a crate too, but it targets wasm32-wasip2 and keeps its
# own lockfile, so it stays out of this workspace.
[workspace]
members = ["cli", "lang/core/common", "lang/core/syntax", "lang/core/model", "lang/core/eval", "runtime/services", "runtime/host", "runtime/renderer", "lsp", "browser"]
default-members = ["cli"]
exclude = ["client/ide/zed"]
resolver = "3"

# Every crate but the facade opts in with `[lints] workspace = true`: a `pub`
# item its root doesn't publish fails CI, so interfaces stay curated.
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tower-lsp-server = "0.22.1"
url = { version = "2", features = ["serde"] }

# Each crate may depend only on the internal crates listed for it. Pipeline
# order: syntax -> model -> eval -> services -> hosts; common is the shared
# kernel every crate may use, and renderer is a leaf services builds on.
# Enforced by cli/tests/architecture.rs.
[workspace.metadata.layers]
common = []
syntax = ["common"]
model = ["common", "syntax"]
eval = ["common", "syntax", "model"]
host = ["common", "model", "eval"]
renderer = []
services = ["common", "syntax", "model", "eval", "host", "renderer"]
lsp = ["common", "syntax", "model", "eval", "host", "services"]
browser = ["common", "syntax", "model", "eval", "services"]
xmd = ["common", "syntax", "model", "eval", "host", "services", "lsp", "browser"]
