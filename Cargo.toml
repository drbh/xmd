# The language, split into layered crates. core/ is the language itself,
# behind the `lang` facade: common (the shared kernel), syntax, document (a
# parsed note), values (what a value is, apart from the engine), modules (the
# .xmd modules as data) and eval (the evaluator); stdlib/ is the .xmd library
# on top.
# services/ is what every host shares and the source of truth for its
# behavior, behind the `services` facade: analysis (language facts: hover,
# symbols, diagnostics, ...), records (typed records over notes and the query
# language) and features (what an editor shows and does and the editing
# session, HTML rendering included). hosts/ holds the programs that run xmd:
# native (native I/O and orchestration, for the native hosts only), lsp (the
# language server), wasm (the browser host) and cli (the xmd binary, which
# assembles them, and the end-to-end tests).
# `clients/ide/zed` is a crate too, but it targets wasm32-wasip2 and keeps its
# own lockfile, so it stays out of this workspace.
[workspace]
members = ["core", "core/common", "core/syntax", "core/document", "core/values", "core/modules", "core/eval", "services", "services/analysis", "services/records", "services/features", "hosts/native", "hosts/lsp", "hosts/wasm", "hosts/cli"]
default-members = ["hosts/cli"]
exclude = ["clients/ide/zed"]
resolver = "3"

# Every crate but the facade opts in with `[lints] workspace = true`: a `pub`
# item its root doesn't publish fails CI, so interfaces stay curated.
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
lsp-types = "0.97"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tower-lsp-server = "0.22.1"
url = { version = "2", features = ["serde"] }

# Each crate may depend only on the internal crates listed for it. Pipeline
# order: syntax -> document, values -> modules -> eval -> lang -> analysis ->
# records -> features -> services -> native -> hosts; common is the
# language's shared kernel. Outside core/ and services/, only their facades
# are visible.
# Enforced by hosts/cli/tests/architecture.rs.
[workspace.metadata.layers]
# core/: the language. Its crates are private to the lang facade.
common = []
syntax = ["common"]
document = ["common", "syntax"]
values = ["common", "syntax"]
modules = ["common", "syntax", "document", "values"]
eval = ["common", "syntax", "document", "values", "modules"]
lang = ["common", "syntax", "document", "values", "modules", "eval"]
# services/: what every host shares, reaching the language only through lang.
# Its crates are private to the services facade.
analysis = ["lang"]
records = ["lang", "analysis"]
features = ["lang", "analysis", "records"]
services = ["analysis", "records", "features"]
# Native I/O, for the native hosts: it sees only the two facades.
native = ["lang", "services"]
# The hosts see only the two facades, and the native ones native; xmd
# (hosts/cli) is the one that assembles them into the binary.
lsp = ["lang", "services", "native"]
wasm = ["lang", "services"]
xmd = ["lang", "services", "native", "lsp", "wasm"]
