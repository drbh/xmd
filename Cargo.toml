# The language crate, split into layered crates, and the HTML renderer they
# share with the web client. `client/ide/zed` is a crate too, but it targets
# wasm32-wasip2 and keeps its own lockfile, so it stays out of this workspace.
[workspace]
members = ["lang", "lang/common", "lang/native", "lang/syntax", "lang/model", "lang/eval", "lang/features", "lang/wasm", "lang/renderer"]
default-members = ["lang"]
exclude = ["client/ide/zed"]
resolver = "3"

# Every crate but the facade opts in with `[lints] workspace = true`: a `pub`
# item its root doesn't publish fails CI, so interfaces stay curated.
[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tower-lsp-server = "0.22.1"
url = { version = "2", features = ["serde"] }

# Each crate may depend only on the internal crates listed for it. Pipeline
# order: syntax -> model -> eval -> features -> hosts; common is the shared
# kernel every crate may use, and renderer is a leaf features builds on.
# Enforced by lang/tests/architecture.rs.
[workspace.metadata.layers]
common = []
syntax = ["common"]
model = ["common", "syntax"]
eval = ["common", "syntax", "model"]
renderer = []
features = ["common", "syntax", "model", "eval", "renderer"]
native = ["common", "syntax", "model", "eval", "features"]
wasm = ["common", "syntax", "model", "eval", "features"]
wtf = ["common", "syntax", "model", "eval", "features", "native", "wasm"]
