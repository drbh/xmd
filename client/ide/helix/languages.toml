# Merge into ~/.config/helix/languages.toml, or a project's .helix/languages.toml.
# `wtf` comes from PATH; install it with
#   curl -fsSL https://github.com/drbh/jot/releases/latest/download/install.sh | sh
# or use an absolute path below if it lives elsewhere.
[language-server.wtf]
command = "wtf"
args = ["lsp"]

[[language]]
name = "wtf"
scope = "text.wtf"
file-types = [{ glob = "*.x.md" }]
roots = [".wtf", ".git"]
language-servers = ["wtf"]
indent = { tab-width = 2, unit = "  " }
block-comment-tokens = { start = "<!--", end = "-->" }
# Reuse Markdown for basic highlighting; WTF semantics still come from the LSP.
grammar = "markdown"
