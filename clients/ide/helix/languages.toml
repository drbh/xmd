# Merge into ~/.config/helix/languages.toml, or a project's .helix/languages.toml.
# `xmd` comes from PATH; install it with
#   mkdir -p ~/.local/bin && curl -fsSL https://github.com/drbh/xmd/releases/latest/download/xmd-$(uname -s)-$(uname -m).tar.gz | tar -xzC ~/.local/bin xmd
# or use an absolute path below if it lives elsewhere.
[language-server.xmd]
command = "xmd"
args = ["lsp"]

[[language]]
name = "xmd"
scope = "text.xmd"
file-types = [{ glob = "*.x.md" }, "xmd"]
roots = [".xmd", ".git"]
language-servers = ["xmd"]
indent = { tab-width = 2, unit = "  " }
block-comment-tokens = { start = "<!--", end = "-->" }
# Reuse Markdown for basic highlighting; XMD semantics still come from the LSP.
grammar = "markdown"
