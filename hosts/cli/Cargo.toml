[package]
name = "xmd"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "xmd"
path = "src/main.rs"

[features]
# The browser (wasm) host, for the end-to-end cases that drive it in-process.
browser = ["dep:wasm"]

[dependencies]
chrono = { workspace = true }
clap = { version = "4", features = ["derive"] }
lang = { path = "../../core" }
lsp = { path = "../lsp" }
native = { path = "../native" }
services = { path = "../../services" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wasm = { path = "../wasm", optional = true }

[dev-dependencies]
lsp-types = { workspace = true }
tempfile = "3"
url = { workspace = true }

[lints]
workspace = true
