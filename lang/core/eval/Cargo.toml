[package]
name = "eval"
version = "0.1.0"
edition = "2024"
publish = false

[features]
native = ["dep:tokio", "dep:ignore", "dep:feed-rs"]

[dependencies]
chrono = { workspace = true }
common = { path = "../common" }
feed-rs = { version = "3", optional = true }
good_lp = { version = "1.15", default-features = false, features = ["microlp"] }
ignore = { version = "0.4", optional = true }
model = { path = "../model" }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
syntax = { path = "../syntax" }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "io-std", "process", "time"] }
url = { workspace = true }

[lints]
workspace = true
