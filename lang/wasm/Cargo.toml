[package]
name = "wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
common = { path = "../common" }
eval = { path = "../eval" }
features = { path = "../features" }
